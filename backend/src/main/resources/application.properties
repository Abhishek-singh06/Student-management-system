# Server Configuration
server.port=8080

# Spring App Name
spring.application.name=cms

# ==========================================
# DATABASE CONFIGURATION
# ==========================================

# PROFILE 1: H2 In-Memory/File Database (Default - ZERO SETUP REQUIRED)
spring.datasource.url=jdbc:h2:file:./cmsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# PROFILE 2: MySQL Database (Uncomment to switch to MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/cmsdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# JPA & HIBERNATE SETTINGS
# ==========================================
# Let Hibernate create/update the tables automatically based on Entities
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# H2 CONSOLE SETTINGS (Accessible at http://localhost:8080/h2-console)
# ==========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Allow H2 console inside frame (needed for Spring Security)
spring.h2.console.settings.web-allow-others=true

# ==========================================
# DATA INITIALIZATION (Runs data.sql to seed users/departments on startup)
# ==========================================
# Defer datasource initialization until after JPA is ready (so Hibernate creates tables first)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# Disable Thymeleaf cache for development (if used)
spring.thymeleaf.cache=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
